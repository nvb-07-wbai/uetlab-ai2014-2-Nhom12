[project]
name = "chesslab-template"
version = "1.0.0"
description = "Student template for the chesslab coursework"
requires-python = "==3.12.*"
dependencies = [
  "chess==1.11.2",
  "fastapi==0.141.1",
  "numpy==1.26.4",
  "pydantic==2.13.5",
  "uvicorn==0.53.0",
  "websockets==15.0.1",
]

[dependency-groups]
dev = ["pytest==8.3.5"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
